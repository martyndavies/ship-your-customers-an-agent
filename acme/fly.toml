# Acme's production stand-in: one Machine runs Acme's webhook endpoint and the
# acme_diagnostics agent.
#
# The only public port is the webhook endpoint Acme already had to have.
# acme_diagnostics adds no port, route, or VPN: it connects out to Blocks Network.
#
# Auto-stop is off: a stopped Machine would drop the agent's network connection.
app = "acme-infra-demo"   # change to a unique name

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
